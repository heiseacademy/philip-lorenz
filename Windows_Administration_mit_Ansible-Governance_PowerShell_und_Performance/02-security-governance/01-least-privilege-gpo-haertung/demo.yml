---
- name: Review and enforce least privilege for local administrators
  hosts: windows
  gather_facts: false
  vars:
    authorized_admins:
      - ansible
  tasks:
    - name: Read local Administrators group before enforcement
      ansible.windows.win_shell: |
        Get-LocalGroupMember -Group "Administrators" | Select-Object -ExpandProperty Name
      register: admins_before
      changed_when: false

    - name: Enforce least privilege (only authorized accounts stay admin)
      ansible.windows.win_group_membership:
        name: Administrators
        members: "{{ authorized_admins }}"
        state: pure

    - name: Read local Administrators group after enforcement
      ansible.windows.win_shell: |
        Get-LocalGroupMember -Group "Administrators" | Select-Object -ExpandProperty Name
      register: admins_after
      changed_when: false

    - name: Show before and after
      ansible.builtin.debug:
        msg:
          - "Vorher: {{ admins_before.stdout_lines }}"
          - "Nachher: {{ admins_after.stdout_lines }}"
