---
- name: Verify Windows role smoke test
  hosts: all
  gather_facts: false
  tasks:
    - name: Read OS caption
      ansible.windows.win_shell: |
        (Get-CimInstance Win32_OperatingSystem).Caption
      register: os_caption
      changed_when: false

    - name: Assert Windows target responded
      ansible.builtin.assert:
        that:
          - os_caption.stdout | trim | length > 0
