---
- name: Install and load PowerShell module remotely
  hosts: windows
  gather_facts: false
  tasks:
    - name: Install PSScriptAnalyzer module from PowerShell Gallery
      community.windows.win_psmodule:
        name: PSScriptAnalyzer
        state: present

    - name: Read installed version
      ansible.windows.win_shell: (Get-Module PSScriptAnalyzer -ListAvailable | Select-Object -First 1).Version.ToString()
      register: module_version
      changed_when: false

    - name: Show installed version
      ansible.builtin.debug:
        msg: "PSScriptAnalyzer {{ module_version.stdout | trim }} installiert"
