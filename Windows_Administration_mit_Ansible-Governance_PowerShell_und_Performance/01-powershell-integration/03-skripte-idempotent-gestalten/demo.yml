---
- name: Run idempotent PowerShell script
  hosts: windows
  gather_facts: false
  tasks:
    - name: Copy idempotent demo script
      ansible.windows.win_copy:
        src: demo.ps1
        dest: C:\Windows\Temp\ansible-idempotent-demo.ps1

    - name: Execute idempotent script
      ansible.windows.win_shell: C:\Windows\Temp\ansible-idempotent-demo.ps1
      register: idempotent_result
      changed_when: "'Changed=True' in idempotent_result.stdout"

    - name: Show idempotence result
      ansible.builtin.debug:
        var: idempotent_result.stdout_lines
