---
- name: Manuelle Software Installation (Chocolatey)
  hosts: windows
  gather_facts: false

  tasks:
    - name: Ensure Chocolatey itself is installed, using community repo for the bootstrap
      chocolatey.chocolatey.win_chocolatey:
        name: chocolatey

    # - name: Install notepadplusplus version 7.0
    #   win_chocolatey:
    #     name: notepadplusplus
    #     version: '7.0'

    - name: Uninstall notepadplusplus version 7.0
      win_chocolatey:
        name: notepadplusplus
        version: '7.0'
        state: absent

    - name: Install multiple packages
      win_chocolatey:
        name:
        - procexp
        - putty
        - windirstat
        pinned: true